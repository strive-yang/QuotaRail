[package]
name = "quotarail"
version = "0.1.0-beta.1"
edition = "2024"
publish = false
description = "A lightweight Windows taskbar and tray monitor for Codex quota"
license = "MIT"
repository = "https://github.com/strive-yang/QuotaRail"
readme = "README.md"
keywords = ["codex", "quota", "windows", "taskbar", "tray"]
categories = ["gui"]

[features]
test-support = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "signal", "sync", "time"] }
sha2 = "0.10"
hmac = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Time", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility"] }
windows = { version = "0.62", features = ["Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Com"] }

[[bin]]
name = "quotarail"
path = "src/bin/quotarail.rs"

[[bin]]
name = "quota_probe"
path = "src/bin/quota_probe.rs"

[[bin]]
name = "mock_codex"
path = "tests/support/mock_codex.rs"
required-features = ["test-support"]
